[project]
name = "sienner"
version = "0.1.0a1"
description = "Portfolio evaluation tool - Stage 1a walking skeleton"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pandas>=2.2",
    "numpy>=2.0",
    "httpx>=0.27",
    "psycopg[binary,pool]>=3.2",
    "pandera>=0.20",
    "pandas-market-calendars>=4.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sienner*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# A DeprecationWarning raised by Sienner's own code is a failure. Third-party
# deprecations are ignored by exact message, so that a NEW one still surfaces
# instead of being hidden behind a blanket ignore.
filterwarnings = [
    "error::DeprecationWarning",
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]
